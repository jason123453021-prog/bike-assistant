appId: com.jason123453021.bikeassistant
name: ${LOCALE_NAME} navigation, RTL, and privacy policy screenshots
---
- launchApp:
    clearState: true
    permissions:
      android.permission.ACCESS_FINE_LOCATION: allow
      android.permission.ACCESS_COARSE_LOCATION: allow
      android.permission.POST_NOTIFICATIONS: allow
- tapOn:
    text: "Wait"
    optional: true
- extendedWaitUntil:
    visible: "Navigation"
    timeout: 30000
- tapOn: "Settings"
- scrollUntilVisible:
    element:
      text: "System & Data"
    direction: DOWN
    timeout: 30000
- tapOn: "System & Data"
- scrollUntilVisible:
    element:
      text: "Language.*"
    direction: DOWN
    timeout: 30000
- tapOn: "Language.*"
- runFlow:
    file: scroll-language-option.yaml
    env:
      TARGET_ID: ${LANGUAGE_OPTION_ID}
- tapOn:
    id: ${LANGUAGE_OPTION_ID}
- assertVisible: ${SETTINGS_LABEL}
- takeScreenshot: ${SCREENSHOT_PREFIX}-settings
- tapOn: ${NAVIGATION_LABEL}
- assertVisible: ${NAVIGATION_LABEL}
- takeScreenshot: ${SCREENSHOT_PREFIX}-navigation
- tapOn: ${ROUTES_LABEL}
- assertVisible: ${ROUTES_LABEL}
- takeScreenshot: ${SCREENSHOT_PREFIX}-routes
- tapOn: ${HISTORY_LABEL}
- assertVisible: ${HISTORY_LABEL}
- takeScreenshot: ${SCREENSHOT_PREFIX}-history
- tapOn: ${SETTINGS_LABEL}
- scrollUntilVisible:
    element:
      text: ${SYSTEM_DATA_LABEL}
    direction: DOWN
    timeout: 30000
- tapOn: ${SYSTEM_DATA_LABEL}
- scrollUntilVisible:
    element:
      text: ${PRIVACY_LABEL}
    direction: DOWN
    timeout: 30000
- tapOn: ${PRIVACY_LABEL}
- assertVisible: ${PRIVACY_LABEL}
- takeScreenshot: ${SCREENSHOT_PREFIX}-privacy
