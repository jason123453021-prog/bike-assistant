appId: com.jason123453021.bikeassistant
name: 多語系字體大小與 RTL 表單截圖
---
- launchApp:
    clearState: true
    permissions:
      android.permission.ACCESS_FINE_LOCATION: allow
      android.permission.ACCESS_COARSE_LOCATION: allow
      android.permission.POST_NOTIFICATIONS: allow
- tapOn:
    text: "Wait"
    optional: true
- extendedWaitUntil:
    visible: "Navigation"
    timeout: 30000
- tapOn: "Settings"
- scrollUntilVisible:
    element:
      text: "Display & Appearance"
    direction: DOWN
    timeout: 30000
- tapOn: "Display & Appearance"
- scrollUntilVisible:
    element:
      text: "Language"
    direction: DOWN
    timeout: 30000
- tapOn: "Language"
- extendedWaitUntil:
    visible: "English (US)"
    timeout: 10000
- takeScreenshot: "font-scale-settings-en"
- scrollUntilVisible:
    element:
      text: "Deutsch"
    direction: DOWN
    timeout: 30000
- tapOn: "Deutsch"
- extendedWaitUntil:
    visible: "Language"
    timeout: 10000
- takeScreenshot: "font-scale-settings-de"
- scrollUntilVisible:
    element:
      text: "Language"
    direction: DOWN
    timeout: 30000
- tapOn: "Language"
- scrollUntilVisible:
    element:
      text: "Русский"
    direction: DOWN
    timeout: 30000
- tapOn: "Русский"
- extendedWaitUntil:
    visible: "Language"
    timeout: 10000
- takeScreenshot: "font-scale-settings-ru"
- scrollUntilVisible:
    element:
      text: "Language"
    direction: DOWN
    timeout: 30000
- tapOn: "Language"
- scrollUntilVisible:
    element:
      text: "العربية"
    direction: DOWN
    timeout: 30000
- tapOn: "العربية"
- takeScreenshot: "font-scale-settings-ar"
