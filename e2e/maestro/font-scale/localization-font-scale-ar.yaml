appId: com.jason123453021.bikeassistant
name: 阿拉伯文字體大小與 RTL 表單截圖
---
- launchApp:
    clearState: true
    permissions:
      android.permission.ACCESS_FINE_LOCATION: allow
      android.permission.ACCESS_COARSE_LOCATION: allow
      android.permission.POST_NOTIFICATIONS: allow
- tapOn:
    text: "Wait"
    optional: true
- extendedWaitUntil:
    visible: "Navigation"
    timeout: 30000
- tapOn: "Settings"
- scrollUntilVisible:
    element:
      text: "System & Data"
    direction: DOWN
    timeout: 30000
- runFlow:
    when:
      notVisible:
        id: "settings-language-selector"
    commands:
      - tapOn: "System & Data"
- scrollUntilVisible:
    element:
      id: "settings-language-selector"
    direction: DOWN
    timeout: 30000
- tapOn:
    id: "settings-language-selector"
- runFlow:
    file: ../scroll-language-option.yaml
    env:
      TARGET_ID: ".*language-option-ar-SA"
- tapOn:
    id: ".*language-option-ar-SA"
- takeScreenshot: "font-scale-settings-ar"
