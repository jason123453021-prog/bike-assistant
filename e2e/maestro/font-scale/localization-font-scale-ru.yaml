appId: com.jason123453021.bikeassistant
name: 俄文字體大小表單截圖
---
- launchApp:
    clearState: true
    permissions:
      android.permission.ACCESS_FINE_LOCATION: allow
      android.permission.ACCESS_COARSE_LOCATION: allow
      android.permission.POST_NOTIFICATIONS: allow
- tapOn:
    text: "Wait"
    optional: true
- extendedWaitUntil:
    visible: "Navigation"
    timeout: 30000
- tapOn: "Settings"
- scrollUntilVisible:
    element:
      text: "System & Data"
    direction: DOWN
    timeout: 30000
- tapOn: "System & Data"
- scrollUntilVisible:
    element:
      text: "Language.*"
    direction: DOWN
    timeout: 30000
- tapOn: "Language.*"
- runFlow:
    file: ../scroll-language-option.yaml
    env:
      TARGET_ID: ".*language-option-ru-RU"
- tapOn:
    id: ".*language-option-ru-RU"
- takeScreenshot: "font-scale-settings-ru"
