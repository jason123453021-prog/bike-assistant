appId: com.jason123453021.bikeassistant
name: Android 封版核心導覽
---
- launchApp:
    clearState: true
    permissions:
      android.permission.ACCESS_FINE_LOCATION: allow
      android.permission.ACCESS_COARSE_LOCATION: allow
      android.permission.POST_NOTIFICATIONS: allow
- tapOn:
    text: "Wait"
    optional: true
- tapOn:
    text: "Wait"
    optional: true
- extendedWaitUntil:
    visible: "Navigation"
    timeout: 30000
- assertVisible: "Navigation"
- assertVisible: "Routes"
- assertVisible: "History"
- assertVisible: "Settings"
- tapOn: "Settings"
- scrollUntilVisible:
    element:
      text: "Display & Appearance"
    direction: DOWN
    timeout: 30000
- assertVisible: "Display & Appearance"
- tapOn: "Routes"
- assertVisible: "Routes"
- tapOn: "History"
- assertVisible: "History"
- tapOn: "Navigation"
- takeScreenshot: "core-navigation-tabs"
