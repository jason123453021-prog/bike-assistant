name: Android 原生 E2E

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - "components/**"
      - "lib/**"
      - "e2e/**"
      - "tests/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "app.config.ts"
      - ".github/workflows/android-e2e.yml"
  push:
    branches: [main]
    paths:
      - "app/**"
      - "components/**"
      - "lib/**"
      - "e2e/**"
      - "tests/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "app.config.ts"
      - ".github/workflows/android-e2e.yml"

permissions:
  contents: read

concurrency:
  group: android-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-e2e:
    name: Android Maestro E2E
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      CI: true
      EXPO_NO_DOCTOR: "1"
      EAS_BUILD_PROFILE: preview
    steps:
      - name: 取得原始碼
        uses: actions/checkout@v4

      - name: 設定 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: 設定 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 設定 Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: 安裝鎖定版本的依賴
        run: pnpm install --frozen-lockfile

      - name: 執行單元與靜態守門
        run: |
          pnpm check
          pnpm lint
          pnpm test:jest
          pnpm test

      - name: 產生 Android 原生專案與 E2E release APK
        run: |
          E2E_NOTIFICATION_HARNESS=true npx expo prebuild --platform android --clean --no-install
          (cd android && E2E_NOTIFICATION_HARNESS=true ./gradlew :app:assembleRelease -PreactNativeArchitectures=x86_64 --no-daemon --stacktrace)
          APK_PATH="$(find android/app/build/outputs/apk/release -type f -name '*.apk' ! -name '*unaligned*' -print -quit)"
          test -s "$APK_PATH"
          mkdir -p build
          cp "$APK_PATH" build/e2e-under-test.apk
          ls -lh build/e2e-under-test.apk

      - name: 啟用 Android Emulator KVM
        run: |
          echo 'KERNEL=="kvm", MODE="0666", GROUP="kvm", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: 啟動 Android Emulator 並執行 Maestro E2E
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          working-directory: ${{ github.workspace }}
          script: |
            test -s build/e2e-under-test.apk
            adb install -r build/e2e-under-test.apk
            adb shell pm grant com.jason123453021.bikeassistant android.permission.POST_NOTIFICATIONS || true
            curl -fsSL https://get.maestro.mobile.dev | bash
            export ANDROID_SERIAL="$(adb devices | awk '/device$/{print $1; exit}')"
            test -n "$ANDROID_SERIAL"
            export MAESTRO_CLI_NO_ANALYTICS=true
            adb -s "$ANDROID_SERIAL" wait-for-device
            "$HOME/.maestro/bin/maestro" test --device "$ANDROID_SERIAL" --format junit --output build/maestro-report.xml --test-output-dir build/maestro-results e2e/maestro/core-navigation.yaml
            bash -lc 'set -e; adb -s "$ANDROID_SERIAL" shell settings put system font_scale 1.0; for LOCALE in ja ko ar; do adb -s "$ANDROID_SERIAL" wait-for-device; "$HOME/.maestro/bin/maestro" test --device "$ANDROID_SERIAL" --format junit --output "build/maestro-localization-${LOCALE}.xml" --test-output-dir "build/maestro-results/localization-${LOCALE}" "e2e/maestro/localization-pages-${LOCALE}.yaml"; done'
            bash -lc 'set -e; adb -s "$ANDROID_SERIAL" wait-for-device; adb -s "$ANDROID_SERIAL" shell settings put system font_scale 2.0; adb -s "$ANDROID_SERIAL" shell am force-stop com.jason123453021.bikeassistant; sleep 5; "$HOME/.maestro/bin/maestro" test --device "$ANDROID_SERIAL" --format junit --output build/maestro-localization-ar-200.xml --test-output-dir build/maestro-results/localization-ar-200 e2e/maestro/localization-ar-large-text.yaml; adb -s "$ANDROID_SERIAL" shell settings put system font_scale 1.0'
            bash -lc 'set -e; SCALE=1.3; SCALE_TAG="$(printf "%s" "$SCALE" | tr "." "-")"; adb -s "$ANDROID_SERIAL" wait-for-device; adb -s "$ANDROID_SERIAL" shell settings put system font_scale "$SCALE"; "$HOME/.maestro/bin/maestro" test --device "$ANDROID_SERIAL" --format junit --output "build/maestro-font-scale-${SCALE_TAG}.xml" --test-output-dir "build/maestro-results/font-scale-${SCALE_TAG}" e2e/maestro/font-scale; adb -s "$ANDROID_SERIAL" shell settings put system font_scale 1.0'
            bash -lc 'set -e; adb -s "$ANDROID_SERIAL" shell pm clear com.jason123453021.bikeassistant; adb -s "$ANDROID_SERIAL" shell pm grant com.jason123453021.bikeassistant android.permission.POST_NOTIFICATIONS || true; adb -s "$ANDROID_SERIAL" shell am force-stop com.jason123453021.bikeassistant; adb -s "$ANDROID_SERIAL" shell am start -W -a android.intent.action.VIEW -d "manus20260617://e2e-notification" com.jason123453021.bikeassistant; sleep 3; "$HOME/.maestro/bin/maestro" test --device "$ANDROID_SERIAL" --format junit --output build/maestro-notification-schedule.xml --test-output-dir build/maestro-results/notification-schedule e2e/maestro/notification-harness-schedule.yaml; adb -s "$ANDROID_SERIAL" shell input keyevent KEYCODE_HOME; sleep 7; adb -s "$ANDROID_SERIAL" shell cmd statusbar expand-notifications; sleep 2; "$HOME/.maestro/bin/maestro" test --device "$ANDROID_SERIAL" --format junit --output build/maestro-notification-open.xml --test-output-dir build/maestro-results/notification-open e2e/maestro/notification-harness-open.yaml'

      - name: 上傳 Maestro 報告與診斷 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bike-assistant-maestro-e2e
          path: |
            build/maestro-report.xml
            build/maestro-notification-*.xml
            build/maestro-font-scale-*.xml
            build/maestro-localization-*.xml
            build/maestro-results
          if-no-files-found: warn
          retention-days: 14
