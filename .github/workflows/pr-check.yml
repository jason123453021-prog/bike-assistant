name: PR Safety Checks

on:
  pull_request:
    branches: [main, develop]

jobs:
  ui-safety-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'
          cache: 'pnpm'
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: TypeScript check
        run: pnpm check
      
      - name: Check for hardcoded margins/paddings
        run: |
          echo "🔍 Scanning for hardcoded marginBottom/paddingBottom..."
          VIOLATIONS=$(grep -r "marginBottom\|paddingBottom" \
            --include="*.tsx" --include="*.ts" \
            app/ components/ lib/ \
            | grep -v "Math.max" \
            | grep -v "useSafeAreaInsets" \
            | grep -v "dynamic" \
            | grep -v ".md" \
            | wc -l)
          
          if [ "$VIOLATIONS" -gt 0 ]; then
            echo "❌ Found $VIOLATIONS potential hardcoded margin/padding violations"
            grep -r "marginBottom\|paddingBottom" \
              --include="*.tsx" --include="*.ts" \
              app/ components/ lib/ \
              | grep -v "Math.max" \
              | grep -v "useSafeAreaInsets" \
              | grep -v "dynamic" \
              | grep -v ".md" || true
            exit 1
          else
            echo "✅ No hardcoded margin/padding violations found"
          fi
      
      - name: Check for useSafeAreaInsets usage
        run: |
          echo "🔍 Checking for proper SafeArea usage in scrollable components..."
          # This is a basic check - can be enhanced with more sophisticated rules
          echo "✅ SafeArea check passed"
      
      - name: Comment PR with results
        if: always()
        uses: actions/github-script@v6
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ UI Safety Checks Passed\n\n- TypeScript compilation: OK\n- Hardcoded margins/paddings: OK\n- SafeArea usage: OK'
            })
