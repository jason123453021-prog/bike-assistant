name: Google Play 正式 AAB

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: google-play-aab-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-aab:
    name: 建置 Google Play 上傳 AAB
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: play-production
    env:
      CI: true
      EXPO_NO_DOCTOR: "1"
      EAS_BUILD_PROFILE: production
      PLAY_UPLOAD_KEYSTORE_PATH: ${{ github.workspace }}/android/app/play-upload.jks
      PLAY_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEYSTORE_PASSWORD }}
      PLAY_UPLOAD_KEY_ALIAS: ${{ secrets.PLAY_UPLOAD_KEY_ALIAS }}
      PLAY_UPLOAD_KEY_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEY_PASSWORD }}
    steps:
      - name: 取得原始碼
        uses: actions/checkout@v4

      - name: 設定 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: 設定 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 設定 Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: 安裝鎖定版本的依賴
        run: pnpm install --frozen-lockfile

      - name: 執行程式品質守門
        run: |
          pnpm check
          pnpm lint
          pnpm test

      - name: 產生 Android 原生專案
        run: npx expo prebuild --platform android --clean --no-install

      - name: 還原受保護的 Play upload keystore
        env:
          PLAY_UPLOAD_KEYSTORE_BASE64: ${{ secrets.PLAY_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          test -n "$PLAY_UPLOAD_KEYSTORE_BASE64"
          printf '%s' "$PLAY_UPLOAD_KEYSTORE_BASE64" | base64 --decode > android/app/play-upload.jks

      - name: 套用正式版簽署設定
        run: node scripts/android-release-signing.cjs android/app/build.gradle

      - name: 建置 Google Play Android App Bundle
        working-directory: android
        run: ./gradlew bundleRelease --no-daemon --stacktrace

      - name: 上傳 Google Play AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: bike-assistant-google-play-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14
